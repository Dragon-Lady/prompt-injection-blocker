[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-injection-blocker"
version = "0.1.0"
description = "Read-only scanner for prompt-injection and LLM anti-analysis text in files before agent review"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Dragon Lady" }]
keywords = ["security", "prompt-injection", "llm", "ai-agents", "promptware", "anti-analysis", "scanner"]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Dragon-Lady/prompt-injection-blocker"
Repository = "https://github.com/Dragon-Lady/prompt-injection-blocker"
Issues = "https://github.com/Dragon-Lady/prompt-injection-blocker/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
prompt-injection-blocker = "prompt_injection_blocker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
norecursedirs = ["build", "dist", "*.egg-info", ".pytest_cache", "__pycache__"]
